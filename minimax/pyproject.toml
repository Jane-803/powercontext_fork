[project]
name = "evolving-sdd-context"
version = "1.0.0"
description = "Task-scoped engineering context backed by seekdb and PowerContext"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "powercontext[server,cli]==1.2.0",
  "pyseekdb==1.4.0.post1; sys_platform == 'linux' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdd_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
